name: Feature request
description: Suggest a GuardScope improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chrome extension
        - Backend API
        - Analysis engine
        - Website
        - Chrome Web Store launch
        - Security/privacy
    validations:
      required: true

