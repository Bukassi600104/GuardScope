name: Bug report
description: Report a GuardScope bug or launch blocker.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps, Gmail state, browser, and extension build.
      placeholder: |
        1. Open Gmail...
        2. Open an email...
        3. Click Analyze...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 126, Brave, Edge
  - type: input
    id: extension-version
    attributes:
      label: Extension version or commit

